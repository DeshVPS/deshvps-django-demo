<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cha Ghor notes · Django</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2937;background:#fffbf5}
header{max-width:960px;margin:0 auto;padding:20px 24px;font-size:22px;font-weight:800;color:#065f46}
.hero{max-width:960px;margin:12px auto;padding:48px 32px;border-radius:24px;background:linear-gradient(135deg,#065f46,#10b981);color:#fff;text-align:center}
.hero h1{font-size:40px;margin:0 0 10px}.hero p{font-size:18px;margin:0;opacity:.92}
main{max-width:720px;margin:0 auto;padding:24px}
.box{background:#fff;border-radius:18px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:18px}
.db{color:#6b7280}.db b{color:#047857}
form{display:flex;gap:10px}input{flex:1;padding:13px 15px;border:1px solid #d1d5db;border-radius:12px;font:inherit;font-size:17px}
button{background:#065f46;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:16px;cursor:pointer}
ul{list-style:none;padding:0;margin:0}li{padding:14px 4px;border-bottom:1px solid #f3f4f6;font-size:18px}li:last-child{border:0}
</style></head>
<body>
<header>🍵 Cha Ghor</header>
<section class="hero"><h1>Today's specials, on Django</h1><p>Notes are saved in PostgreSQL through Django's ORM.</p></section>
<main>
  <div class="box db">Database: <b id="engine">{{ engine }}</b></div>
  <div class="box"><form method="post">{% csrf_token %}<input name="text" placeholder="Today's special…" required><button>Save</button></form></div>
  <div class="box"><ul id="notes">{% for n in notes %}<li>📝 {{ n.text }}</li>{% empty %}<li>No notes yet.</li>{% endfor %}</ul></div>
</main>
</body></html>
